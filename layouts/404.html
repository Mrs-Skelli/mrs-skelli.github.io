<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, follow" />
  <title>404 – Lost Bones</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: rgba(0, 8, 18, 0.72);
      pointer-events: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(1rem, 3vw, 2rem);
      box-sizing: border-box;
      background: #02080f;
      font-family: 'Fira Code', monospace;
      color: #7ad7ef;
      display: grid;
      place-items: center;
      text-align: center;
      overflow-x: hidden;
    }

    .error-page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 48rem;
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: clamp(0.5rem, 2vh, 1.25rem);
    }

    .astronaut {
      width: clamp(11rem, 42vmin, 24rem);
      aspect-ratio: 1;
      background: url('/skeleton-floating.png') no-repeat center;
      background-size: contain;
      animation: bounce 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
      100% { transform: translateY(0); }
    }

    h1 {
      font-size: clamp(3.5rem, 12vw, 6rem);
      margin: 0 0 0.5rem 0;
      color: #9ae8ff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
    }

    p {
      font-size: clamp(1rem, 3.4vw, 1.3rem);
      line-height: 1.5;
      margin: 0 0 1.25rem 0;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
      overflow-wrap: anywhere;
    }

    a {
      color: #b8f0ff;
      text-decoration: underline;
    }

    a:hover {
      color: #ffffff;
    }

    a:focus-visible {
      color: #ffffff;
      outline: 3px solid #ffe08a;
      outline-offset: 0.3rem;
    }

    .content {
      width: 100%;
      max-width: 36rem;
      min-width: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .astronaut {
        animation: none;
      }
    }

    @media (max-width: 40rem) {
      .error-page,
      .content {
        width: calc(100vw - 2rem);
        max-width: calc(100vw - 2rem);
      }
    }
  </style>
</head>
<body>
  <main class="error-page" aria-labelledby="error-title">
    <div class="astronaut" aria-hidden="true"></div>
    <div class="content">
      <h1 id="error-title">404</h1>
      <p>A spoopy skeleton got lost in the void…</p>
      <p><a href="/">Return to safety</a></p>
    </div>
  </main>
</body>
</html>
